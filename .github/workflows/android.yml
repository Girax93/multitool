name: Android shell

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    env:
      SHELL_VERSION_CODE: ${{ github.run_number }}
      SHELL_VERSION_NAME: 1.0.${{ github.run_number }}
      # sha256 of the release keystore (the file itself lives only in the
      # ANDROID_KEYSTORE_B64 secret and in Ari's backup). Update if the key is rotated.
      EXPECTED_KEYSTORE_SHA256: 956573515328ba11c659cafa83721b5467961b9f4042747d4f007071f316a645
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK; just make sure our API level and
      # build-tools are present and the licences are accepted.
      - name: Android SDK components
        run: |
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n1)"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "SDK at $ANDROID_HOME"; ls "$ANDROID_HOME/platforms"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            # Guard: every build must use the same key, or installed apps can't update.
            actual=$(sha256sum "$RUNNER_TEMP/release.jks" | cut -d' ' -f1)
            echo "Keystore sha256: $actual"
            if [ "$actual" != "$EXPECTED_KEYSTORE_SHA256" ]; then
              echo "::error::Keystore fingerprint mismatch — refusing to build with a different signing key"
              exit 1
            fi
          else
            echo "::error::No ANDROID_KEYSTORE_B64 secret — refusing to publish a debug-signed release"
            exit 1
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          cp "$apk" "multitool-shell-${SHELL_VERSION_NAME}.apk"
          ls -la multitool-shell-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: multitool-shell-*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shell-v${{ env.SHELL_VERSION_NAME }}
          name: MultiTool shell v${{ env.SHELL_VERSION_NAME }}
          body: |
            Android shell build ${{ env.SHELL_VERSION_NAME }} (versionCode ${{ github.run_number }}) from ${{ github.sha }}.

            Install: open this page on your phone, download the `.apk`, tap it.
            Already installed? Settings → About → "Check for shell update" inside the app.
          files: multitool-shell-*.apk
