# MultiTool sync API — Cloudflare Worker + D1. Deployed by .github/workflows/worker.yml.
# The D1 database id is filled in by the workflow (it creates the database on
# first run); locally, `node worker/dist/node-server.js` needs none of this.
name = "multitool-sync"
main = "src/index.ts"
compatibility_date = "2026-08-01"
account_id = "dd4986130a0053a20b83e627b1b91a86"
workers_dev = false

# One-level subdomain on purpose: the zone's Universal SSL certificate covers
# *.ariilden.com, while api.multitool.ariilden.com would need a paid
# Advanced Certificate (the first deploy proved that: HTTP worked, HTTPS never got a cert).
routes = [{ pattern = "multitool-api.ariilden.com", custom_domain = true }]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "multitool"
database_id = "__D1_DATABASE_ID__"
migrations_dir = "migrations"
