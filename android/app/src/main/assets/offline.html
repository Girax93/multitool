<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MultiTool — offline</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0f1216; color: #e6e9ee; font-family: system-ui, sans-serif; }
      .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
      h1 { font-size: 20px; margin: 0; }
      p { color: #8b95a5; margin: 0; }
      button { margin-top: 12px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #f5a524; color: #1a1200; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Can't reach MultiTool</h1>
      <p>The app couldn't be loaded. Check your connection and try again.</p>
      <button onclick="window.MultiToolAndroid && MultiToolAndroid.reload()">Retry</button>
    </div>
  </body>
</html>
